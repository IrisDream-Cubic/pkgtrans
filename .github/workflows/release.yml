name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（可带或不带 v）
        required: true
        default: '1.0'

# 需要 contents: write 才能创建 Release。
# 注意：仓库设置里若把 Actions 的 Workflow permissions 设成只读，
# 这里的 write 会被仓库策略压掉，Release 步骤会 403。
permissions:
  contents: write

jobs:
  version:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME}}"
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v"     >> "$GITHUB_OUTPUT"
          echo "版本号：$v（tag：v$v）"

  test:
    name: 发布前自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 跑自测（本地 mock API，不联网）
        run: python3 run_tests.py

  source:
    name: 源码 tarball
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 生成（git archive，可重复构建）
        run: sh packaging/build-source-tarball.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: source-tarball
          path: dist/*.tar.gz

  arch:
    name: Arch 软件包
    needs: [version, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: dist
      # 用 docker run 而不是 container:，因为 archlinux 基础镜像里没有 git，
      # 而 container 模式下 actions/checkout 需要容器内自带 git。
      - name: makepkg
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD:/w" -w /w archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed --disable-download-timeout base-devel python
            useradd -m builder
            mkdir -p /build
            cp packaging/PKGBUILD /build/
            cp dist/pkgtrans-*.tar.gz /build/
            chown -R builder /build
            su builder -s /bin/sh -c "cd /build && makepkg -f --nodeps --noconfirm"
            cp /build/*.pkg.tar.zst /w/out/
          '
          ls -lh out
      - name: 装进干净的 Arch 容器验证
        run: |
          docker run --rm -v "$PWD:/w" archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed --disable-download-timeout python > /dev/null
            pacman -U --noconfirm -d /w/out/*.pkg.tar.zst > /dev/null
            pkgtrans --version | tail -4
            test -f /usr/share/zsh/site-functions/_pkgtrans
            test -f /usr/share/bash-completion/completions/pkgtrans
          '
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: out/*.pkg.tar.zst

  deb:
    name: deb 软件包
    needs: [version, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: dist
      - name: 构建（本机有 dpkg-deb，会用它）
        run: python3 packaging/build-deb.py --outdir dist --version "${{ needs.version.outputs.version }}"
      - name: 用 apt 真装一遍
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/pkgtrans_*_all.deb
          pkgtrans --version | tail -4
          test -f /usr/share/zsh/site-functions/_pkgtrans
      - name: lintian
        run: |
          sudo apt-get install -y lintian || true
          lintian --fail-on error dist/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  rpm:
    name: rpm 软件包
    needs: [version, source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: source-tarball
          path: dist
      - name: rpmbuild（spec 的 %check 里会跑自测）
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD:/w" -w /w fedora:latest bash -c '
            set -e
            dnf install -y rpm-build python3 > /dev/null
            mkdir -p ~/rpmbuild/BUILD ~/rpmbuild/BUILDROOT ~/rpmbuild/RPMS ~/rpmbuild/SOURCES ~/rpmbuild/SPECS ~/rpmbuild/SRPMS
            cp dist/pkgtrans-*.tar.gz ~/rpmbuild/SOURCES/
            rpmbuild -bb --define "_topdir $HOME/rpmbuild" packaging/pkgtrans.spec
            cp ~/rpmbuild/RPMS/noarch/*.rpm /w/out/
          '
          ls -lh out
      - name: 装进干净的 Fedora 容器验证
        run: |
          docker run --rm -v "$PWD:/w" fedora:latest bash -c '
            set -e
            dnf install -y /w/out/*.noarch.rpm > /dev/null
            pkgtrans --version | tail -4
          '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: out/*.rpm

  nix:
    name: Nix flake 可构建
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      # 只验证、不产出可下载的包：nix build 的结果里 shebang 指向 /nix/store/...，
      # 那个路径只在构建机上存在，打成 tarball 发出去别人跑不起来。
      # Nix 用户的安装方式本来就是 flake：
      #   nix run github:IrisDream-Cubic/pkgtrans -- keylist
      - name: 构建 + 冒烟测试
        run: |
          nix build .# --print-build-logs
          ./result/bin/pkgtrans --version | tail -4
          ./result/bin/pkgtrans help > /dev/null
          env -i ./result/bin/pkgtrans --version > /dev/null
          echo "✓ flake 构建通过，env -i 下也能跑"

  release:
    name: 发 Release
    needs: [version, test, arch, deb, rpm, nix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 SHA256SUMS
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: pkgtrans ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
