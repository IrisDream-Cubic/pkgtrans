name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 自测 (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 跑自测（本地 mock API，不联网、不需要密钥）
        run: python3 run_tests.py

  syntax:
    name: 语法与 deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python 语法
        run: python3 -m py_compile pkgtrans run_tests.py packaging/build-deb.py
      - name: Shell 语法
        run: |
          sh -n install.sh
          sh -n packaging/build-all.sh
          sh -n packaging/build-source-tarball.sh
          bash -n packaging/pkgtrans.bash-completion
      - name: 构建 deb
        run: python3 packaging/build-deb.py --outdir dist
      - name: 用 dpkg / apt 真装一遍
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/pkgtrans_*_all.deb
          pkgtrans --version | tail -4
          pkgtrans help > /dev/null
          test -f /usr/share/zsh/site-functions/_pkgtrans

  pkgbuild:
    name: PKGBUILD 可构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # archlinux 基础镜像里没有 git，所以不能用 container: + actions/checkout
      - name: 在 Arch 容器里 makepkg
        run: |
          mkdir -p out && chmod 777 out
          VER=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          docker run --rm -v "$PWD:/w" -w /w archlinux:latest bash -c '
            set -e
            pacman -Syu --noconfirm --needed --disable-download-timeout base-devel python git
            useradd -m builder
            git config --global --add safe.directory /w
            mkdir -p /build
            cp packaging/PKGBUILD /build/
            git archive --format=tar.gz --prefix=pkgtrans-'"$VER"'/ -o /build/pkgtrans-'"$VER"'.tar.gz HEAD
            chown -R builder /build
            su builder -s /bin/sh -c "cd /build && makepkg -f --nodeps --noconfirm"
            cp /build/*.pkg.tar.zst /w/out/
          '
          ls -lh out

  windows:
    name: Windows（exe + winget）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # PyInstaller 不支持交叉编译，exe 只能在 Windows 上打。
      # 完整自测在 Linux/macOS 上跑（依赖 POSIX 的 .zshrc 和 /bin/sh 假二进制），
      # 这里跑的是 packaging/windows-smoke.py，专测 Windows 路径。
      - name: 打单文件 exe
        run: |
          pip install --disable-pip-version-check pyinstaller
          # 脚本没有 .py 后缀，PyInstaller 要一个常规文件名
          Copy-Item pkgtrans pkgtrans_app.py
          pyinstaller --onefile --console --name pkgtrans-windows-x64 `
            --distpath dist --workpath build --specpath build pkgtrans_app.py
      - name: 冒烟测试
        run: |
          Get-Item dist\pkgtrans-windows-x64.exe | Select-Object Name, Length
          python packaging/windows-smoke.py dist\pkgtrans-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/pkgtrans-windows-x64.exe
          if-no-files-found: error

  nix:
    name: Nix 可构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: 构建并冒烟测试
        run: |
          nix build .# --print-build-logs
          ./result/bin/pkgtrans --version | tail -4
          ./result/bin/pkgtrans help > /dev/null
